<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxford Learner — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">📘 Oxford Learner</div>
    <nav class="nav">
      <a href="index.html" class="active">Panel</a>
      <a href="study.html">Çalış</a>
      <a href="stats.html">İstatistik</a>
      <a href="settings.html">Ayarlar</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-main">
        <div class="hero-chips">
          <span id="hero-level" class="hero-chip">⭐ Seviye 1</span>
          <span id="hero-streak" class="hero-chip">🔥 0 gün</span>
        </div>
        <h1 id="hero-title">Bugün harika bir gün! 🌟</h1>
        <p id="hero-sub" class="muted">Yükleniyor…</p>
        <div class="hero-xp">
          <div class="hero-xp-bar"><div id="hero-xp-fill" class="hero-xp-fill"></div></div>
          <span id="hero-xp-text" class="muted small"></span>
        </div>
        <a href="study.html" class="btn btn-primary btn-lg">Çalışmaya başla →</a>
      </div>

      <div class="hero-ring" title="Günlük hedef">
        <svg viewBox="0 0 120 120" class="ring-svg">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle id="ring-fg" class="ring-fg" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-label">
          <span id="ring-pct">0%</span>
          <span class="muted small">günlük hedef</span>
        </div>
      </div>
    </section>

    <section class="cards">
      <div class="card stat">
        <div class="stat-icon">🔁</div>
        <div class="stat-num" id="due-count">–</div>
        <div class="stat-label">Tekrar zamanı gelen</div>
      </div>
      <div class="card stat">
        <div class="stat-icon">🎯</div>
        <div class="stat-num" id="today-count">–</div>
        <div class="stat-label">Bugün çözülen</div>
      </div>
      <div class="card stat">
        <div class="stat-icon">✅</div>
        <div class="stat-num" id="learned-count">–</div>
        <div class="stat-label">Öğrenilen toplam</div>
      </div>
      <div class="card stat">
        <div class="stat-icon">📚</div>
        <div class="stat-num" id="total-count">–</div>
        <div class="stat-label">Toplam kelime</div>
      </div>
    </section>

    <section class="levels">
      <h2>Seviyeler</h2>
      <div id="level-bars" class="level-bars"></div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/sm2.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initDashboard());
  </script>
</body>
</html>
