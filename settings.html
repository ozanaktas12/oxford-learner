<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxford Learner — Ayarlar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">📘 Oxford Learner</div>
    <nav class="nav">
      <a href="index.html">Panel</a>
      <a href="study.html">Çalış</a>
      <a href="stats.html">İstatistik</a>
      <a href="settings.html" class="active">Ayarlar</a>
    </nav>
  </header>

  <main class="container narrow">
    <h1>Ayarlar</h1>

    <div class="form-group">
      <label for="daily-new">Günlük yeni kelime limiti</label>
      <input id="daily-new" type="number" min="0" max="100" />
      <p class="muted small">Her gün kaç yeni kelime gösterilsin.</p>
    </div>

    <div class="form-group">
      <label for="session-size">Oturum başına kart sayısı</label>
      <input id="session-size" type="number" min="5" max="100" />
    </div>

    <div class="form-group">
      <label for="daily-goal">Günlük hedef (cevap sayısı)</label>
      <input id="daily-goal" type="number" min="5" max="200" />
      <p class="muted small">Panelde günlük ilerleme çubuğu bu hedefe göre dolar.</p>
    </div>

    <div class="form-group">
      <label for="levels">Çalışılacak seviyeler</label>
      <div id="levels" class="checks">
        <label><input type="checkbox" value="A1" /> A1</label>
        <label><input type="checkbox" value="A2" /> A2</label>
        <label><input type="checkbox" value="B1" /> B1</label>
        <label><input type="checkbox" value="B2" /> B2</label>
      </div>
    </div>

    <div class="actions">
      <button id="save-btn" class="btn btn-primary">Kaydet</button>
      <span id="save-msg" class="muted small"></span>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initSettings());
  </script>
</body>
</html>
